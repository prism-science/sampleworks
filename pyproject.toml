[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27"]

[dependency-groups]
analysis = [
  "ipython",
  "joblib",
  "marimo",
  "matplotlib",
  "mdtraj",
  "pandas",
  "peppr",
  "polars",
  "pyzmq",
  "scikit-learn",
  "seaborn"
]
test = ["pytest", "pytest-cov", "pytest-loguru"]

[tool.pixi.feature.dev]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.feature.dev.pypi-dependencies]
pytest = "*"
pytest-cov = "*"
mypy = "*"
prek = "*"
ty = "==0.0.39"
ruff = "*"
pytest-loguru = "*"
python-semantic-release = "*"


[tool.pixi.feature.boltz]
pypi-dependencies = {"boltz" = "==2.2.1", "cuequivariance-torch" = "*", "cuequivariance-ops-torch-cu12" = "*", "rdkit" = ">=2025.3.6"}
platforms = ["linux-64"]

[tool.pixi.feature.boltz.pypi-options.dependency-overrides]
click = "==8.1.7"

[tool.pixi.feature.boltz-osx]
pypi-dependencies = {"boltz" = "*", "cuequivariance-torch" = "*", "rdkit" = ">=2025.3.6", "joblib" = "*", "sfcalculator-torch" = ">=0.3.2"}
platforms = ["osx-arm64"]


[tool.pixi.feature.protenix]
pypi-dependencies = {"protenix" = "*", "einx" = "*", "triton" = "*"}
platforms = ["linux-64"]

[tool.pixi.feature.external-tools]
# Binaries the eval scripts shell out to. Kept separate from the `analysis`
# feature so adding one does not re-solve the model environments, and bioconda
# is scoped here so everything else keeps solving against conda-forge alone.
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.feature.external-tools.dependencies]
# PDB-REDO's ramachandran/torsion z-score tool, invoked as a binary on PATH by
# scripts/eval/run_and_process_tortoize.py.
tortoize = ">=2.0.16,<3"

[tool.pixi.feature.protpardelle]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.feature.protpardelle.dependencies]
biopython = "*"
einops = "*"
huggingface_hub = "*"
hydra-core = "*"
jupyter = "*"
numpy = ">=1.25.0,<2.0"
omegaconf = "*"
pandas = "==2.3.1"
prody = "*"
pyyaml = "*"
scipy = "*"
tqdm = "*"
typer = "*"

[tool.pixi.feature.protpardelle.pypi-dependencies]
protpardelle = {git = "https://github.com/ProteinDesignLab/protpardelle-1c.git", rev = "ee378400f25b801fa481028000f9060183d7fb4c"}
torch = ">=2.6.0,<2.8"
biotite = "*"
dm-tree = "*"
jaxtyping = "*"
ml_collections = "*"
modelcif = "*"
transformers = "*"
wandb = "*"

[project]
authors = [
    {email = "karson.chrispens@ucsf.edu", name = "Karson Chrispens"},
    {email = "marcus.collins@astera.org", name = "Marcus D. Collins"}
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry"
]
dependencies = [
  "atomworks[ml]==2.1.1",
  "joblib",
  "einx<0.4",
  "hydra-core",
  "jax",
  "jaxtyping",
  "loguru",
  "omegaconf",
  "python-dotenv",
  "sfcalculator-torch>=0.3.3"
]
description = "Experimentally guided biomolecular ensemble generation."
keywords = ["biomolecular-structure", "crystallography", "diffusion", "ensemble-generation", "protein-structure"]
license = {file = "LICENSE"}
name = "sampleworks"
readme = "README.md"
requires-python = ">= 3.11, <3.14"
version = "0.18.1"

[project.urls]
Changelog = "https://github.com/prism-science/sampleworks/blob/main/CHANGELOG.md"
Homepage = "https://diffuse.science/posts/sampleworks/"
Issues = "https://github.com/prism-science/sampleworks/issues"
Repository = "https://github.com/prism-science/sampleworks"

[project.scripts]
sampleworks-analysis = "sampleworks.runs.analysis_cli:main"
sampleworks-guidance = "sampleworks.cli.guidance:main"
sampleworks-runs = "sampleworks.runs.cli:main"

[tool.hatch.build.targets.sdist]
include = [
  "/analyses",
  "/CHANGELOG.md",
  "/experiments",
  "/LICENSE",
  "/pyproject.toml",
  "/README.md",
  "/src",
  "/tests"
]

[tool.hatch.build.targets.wheel]
packages = ["src/sampleworks"]

[tool.hatch.build.targets.wheel.force-include]
"analyses" = "analyses"
"experiments" = "experiments"

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
disallow_untyped_defs = false
ignore_missing_imports = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pixi.activation.env]
CUDA_HOME = "$CONDA_PREFIX"
PYTHONNOUSERSITE = "1"

[tool.pixi.dependencies]
ninja = "*"
# boltz 2.2.1 requires numpy>=1.26,<2.0. Keep this workspace-wide cap until
# Boltz supports NumPy 2.x so the shared boltz environments remain solvable.
numpy = "<2.0"
pyarrow = "==17.0.0"

[tool.pixi.target.linux-64.dependencies]
cuda-toolkit = ">=12,<13"
gcc_linux-64 = ">=9,<13"
gxx_linux-64 = ">=9,<13"

[tool.pixi.environments]
analysis = {features = ["analysis", "external-tools"]}
analysis-dev = {features = ["analysis", "dev", "external-tools"]}
boltz = {features = ["boltz"]}
boltz-analysis = {features = ["boltz", "analysis"]}
boltz-dev = {features = ["boltz", "dev"]}
boltz-osx = {features = ["boltz-osx", "dev", "analysis"]}
protenix = {features = ["protenix"]}
protenix-dev = {features = ["protenix", "dev"]}
protpardelle = {features = ["protpardelle"]}
protpardelle-dev = {features = ["protpardelle", "dev"]}
rf3 = {features = ["rf3"]}
rf3-dev = {features = ["rf3", "dev"]}

[tool.pixi.feature.protenix.pypi-options.dependency-overrides]
rdkit = ">=2024.3.5,<2025.9"

[tool.pixi.feature.rf3.pypi-dependencies]
rc-foundry = {editable = true, extras = ["rf3"], git = "https://github.com/k-chrispens/foundry.git"}

# Workspace-level override: reciprocalspaceship (sfcalculator-torch transitive dep)
# caps pandas<=2.2.3 in its metadata, but runs fine on 2.3.1; protenix hard-pins
# pandas==2.3.1. Standardize all envs on 2.3.1 to avoid silent downgrades.
[tool.pixi.pypi-options.dependency-overrides]
pandas = "==2.3.1"
gemmi = "==0.6.7"

[tool.pixi.pypi-dependencies]
# Differentiable structure factors and diffuse scattering for the diffuse
# guidance target; the `sf` extra pulls torch and gemmi, already in every env.
# Pinned to a release tag, not a branch -- a branch pin resolves once at lock
# time and never moves, so new work would never arrive. Bump the tag instead.
lunus = {tag = "v0.2.0", extras = ["sf"], git = "https://github.com/lanl/lunus.git"}
sampleworks = {editable = true, path = "."}

[tool.pixi.system-requirements]
cuda = "12"

# Includes slow tests that require GPU or model weights
[tool.pixi.tasks.all-tests]
args = [{arg = "flags", default = ""}]
cmd = "pytest {{ flags }}"

[tool.pixi.tasks.cpu-tests]
cmd = "pytest -m 'not gpu' --cov=sampleworks --cov-report=xml --cov-report=term"

[tool.pixi.tasks.gpu-tests]
cmd = "pytest -m gpu"

# Cross-env tasks use bash to orchestrate across environments because pixi's
# depends-on/alias mechanism only works within a single environment.
# This continues past failures, exits 1 if any env failed.
[tool.pixi.tasks.test-all]
cmd = "f=0; pixi run -e boltz-dev all-tests || f=1; pixi run -e protenix-dev all-tests || f=1; pixi run -e rf3-dev all-tests || f=1; pixi run -e protpardelle-dev all-tests || f=1; exit $f"

[tool.pixi.tasks.test-fast]
cmd = "f=0; pixi run -e boltz-dev tests || f=1; pixi run -e protenix-dev tests || f=1; pixi run -e rf3-dev tests || f=1; pixi run -e protpardelle-dev tests || f=1; exit $f"

# NOTE: if new model environment is added, we need new entries here
# Per-env: pixi run -e rf3-dev tests "-k integration"
[tool.pixi.tasks.tests]
args = [{arg = "flags", default = ""}]
cmd = "pytest -m 'not slow' {{ flags }}"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pytest.ini_options]
addopts = "-v --strict-markers"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "gpu: marks tests that require a GPU runner"
]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.ruff]
extend-include = ["*.ipynb"]
line-length = 100
src = []
target-version = "py311"

[tool.ruff.lint]
fixable = ["I001", "F401", "UP"]
ignore = ["E402", "E721", "E731", "E741", "F722", "UP015"]
select = ["E", "F", "I001", "UP"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"collections" = "co"
"functools" = "ft"
"itertools" = "it"

[tool.ruff.lint.isort]
combine-as-imports = true
extra-standard-library = ["typing_extensions"]
lines-after-imports = 2
order-by-type = false

[tool.ruff.lint.per-file-ignores]
"*.mo.py" = ["ALL"]

[tool.semantic_release]
allow_zero_version = true
assets = ["pixi.lock"]
build_command = "pixi lock"
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
major_on_zero = false
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[tool.semantic_release.publish]
upload_to_vcs_release = true

[tool.semantic_release.remote]
type = "github"

[tool.ty.environment]
python-version = "3.11"

[[tool.ty.overrides]]
include = ["src/sampleworks/eval/bond_angle_and_length_outlier_eval_script.py"]

[tool.ty.overrides.rules]
possibly-missing-attribute = "ignore"

[tool.ty.rules]
invalid-argument-type = "warn"
invalid-assignment = "warn"
invalid-method-override = "warn"
invalid-parameter-default = "warn"
no-matching-overload = "warn"
not-iterable = "warn"
not-subscriptable = "warn"
too-many-positional-arguments = "warn"
unknown-argument = "warn"
unresolved-attribute = "warn"
# Pre-existing type issues across the codebase; warn instead of error
# so ty runs in CI without blocking PRs while the team fixes them.
unresolved-import = "ignore"
unsupported-operator = "warn"
unused-ignore-comment = "warn"
unused-type-ignore-comment = "warn"
