name: GPU Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'pixi.lock'
      - '.github/workflows/gpu-tests.yml'
  pull_request_target:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'pixi.lock'
      - '.github/workflows/gpu-tests.yml'
  workflow_dispatch:

concurrency:
  group: gpu-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gpu-tests:
    runs-on: gpu-1
    timeout-minutes: 30
    environment: gpu-testing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `models` lists the checkpoints each env's tests require so that
        # "Check model checkpoints" can resolve them
        include:
          - environment: boltz-dev
            models: boltz1 boltz2
          - environment: protenix-dev
            models: protenix
          - environment: rf3-dev
            models: rf3

    name: ${{ matrix.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # pull_request_target checks out the base branch by default. We need
          # the PR head to actually test PR code. This runs untrusted code on
          # gpu-1, mitigated by: environment approval gate (gpu-testing),
          # read-only token (contents: read), and reviewer sign-off before any
          # steps execute. Reviewers: validate security-sensitive changes before
          # approving.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pixi
        uses: prefix-dev/setup-pixi@19eac09b398e3d0c747adc7921926a6d802df4da # v0.8.8
        with:
          pixi-version: v0.82.1
          cache: false  # NFS-backed cache on self-hosted runner handles this

      # Fail fast instead of letting every wrapper-backed test skip on a missing checkpoint.
      - name: Check model checkpoints
        run: >-
          pixi run -e ${{ matrix.environment }} python -c
          "import sys; from sampleworks.utils.guidance_script_arguments import _resolve_checkpoint;
          [print(m, _resolve_checkpoint(m)) for m in sys.argv[1:]]"
          ${{ matrix.models }}

      - name: Build CUDA extensions
        run: pixi run -e ${{ matrix.environment }} python3 -c "from sampleworks.core.forward_models.xray.real_space_density_deps.ops.csrc import dilate_points_cuda"

      - name: Run tests
        run: pixi run -e ${{ matrix.environment }} gpu-tests

      # TORCH_EXTENSIONS_DIR persists across jobs; a killed build leaves a lock that hangs the
      # next one. Runner pods are single-tenant per job, so no live build can hold it here.
      - name: Clear torch extension locks
        if: always()
        run: rm -f "${TORCH_EXTENSIONS_DIR:?}"/*/lock
