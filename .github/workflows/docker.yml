name: Build and Push Docker Images

# Two-image split, both pushed to Harbor's private `diffuse` project:
#   1. pixi-with-checkpoints from Dockerfile (target `public`), built on the
#      checkpoints image that checkpoints.yml rebuilds from upstream sources.
#   2. The Astera overlay from Dockerfile.astera, based on the exact digest
#      built in step 1.
#
# Both run on GitHub-hosted runners. Harbor is reachable only over Astera's
# tailnet: each job joins it as an ephemeral tag:ci-n device through the
# `harbor-publish` environment's Tailscale trust credential (TS_CI_CLIENT_ID,
# TS_CI_AUDIENCE, exchanged for a GitHub OIDC token, hence id-token: write),
# which can reach Harbor and nothing else, and pushes with the environment's
# Harbor robot (HARBOR_USERNAME, HARBOR_PASSWORD).

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  PUBLIC_IMAGE_NAME: diffuse/pixi-with-checkpoints-public
  # Harbor path pinned by digest, without the registry host, as printed by
  # checkpoints.yml. Required: there is no fallback image.
  CHECKPOINTS_IMAGE: ${{ vars.SAMPLEWORKS_CHECKPOINTS_IMAGE }}
  CUDA_BASE_IMAGE: ${{ vars.SAMPLEWORKS_CUDA_BASE_IMAGE || 'nvidia/cuda:12.4.1-devel-ubuntu22.04@sha256:da6791294b0b04d7e65d87b7451d6f2390b4d36225ab0701ee7dfec5769829f5' }}

  # Only the registry HOST is secret (repo secret ASTERA_REGISTRY); image paths
  # and digests stay plain variables. This repo is public, so its Actions logs
  # are public and only secrets are masked. Masking is substring-based, so
  # keeping the secret to the bare host masks it inside every longer image ref
  # while leaving digests readable when a build fails. It is set per job because
  # workflow-level env cannot read the secrets context.
  ASTERA_IMAGE_NAME: diffuse/pixi-with-checkpoints

  DOCKER_METADATA_SHORT_SHA_LENGTH: 7

jobs:
  public:
    name: Public pixi-with-checkpoints image
    runs-on: ubuntu-latest
    # Holds the Tailscale trust credential and the Harbor robot; deployable
    # from main and v* tags only.
    environment: harbor-publish
    permissions:
      contents: read
      id-token: write
    env:
      ASTERA_REGISTRY: ${{ secrets.ASTERA_REGISTRY }}
    outputs:
      image-digest: ${{ steps.public-build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # The image bakes the model checkpoints; the hosted runner's default free
      # space is not enough.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
            /usr/lib/jvm /opt/microsoft /opt/google /opt/az /usr/share/az_* /usr/local/julia* /usr/share/miniconda || true
          sudo apt-get clean || true
          docker system prune -af || true
          df -h /
          free -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Validate Astera registry configured
        run: |
          # The Harbor credentials go to whatever host this names; refuse an
          # empty value (login-action would default to Docker Hub) or a public one.
          if [ -z "${ASTERA_REGISTRY}" ]; then
            echo "ASTERA_REGISTRY repository secret must be set."
            exit 1
          fi
          case "${ASTERA_REGISTRY}" in
            docker.io|index.docker.io|registry-1.docker.io)
              echo "ASTERA_REGISTRY must be the internal registry, not a public one."
              exit 1 ;;
          esac

      - name: Join Astera tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_CI_CLIENT_ID }}
          audience: ${{ vars.TS_CI_AUDIENCE }}
          tags: tag:ci-n

      - name: Wait for Harbor
        run: |
          for _ in $(seq 1 12); do
            curl -fsS --max-time 5 "https://${ASTERA_REGISTRY}/api/v2.0/ping" && exit 0
            sleep 5
          done
          echo "Astera registry unreachable over the tailnet."
          exit 1

      - name: Login to Harbor
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.ASTERA_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Tags in `diffuse` are immutable: no moving tags, and a release tag's
      # commit was already pushed as sha-<short> from main.
      - name: Docker metadata for public image
        id: public-meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.ASTERA_REGISTRY }}/${{ env.PUBLIC_IMAGE_NAME }}
          # `diffuse` tags are immutable, so the release must not push a moving `latest`.
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,enable=${{ github.ref_type != 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}

      - name: Validate checkpoint image input
        id: checkpoint-ref
        run: |
          if [ -z "${CHECKPOINTS_IMAGE}" ]; then
            echo "Set the SAMPLEWORKS_CHECKPOINTS_IMAGE repository variable to the path@digest checkpoints.yml printed."
            exit 1
          fi
          if [ "${CHECKPOINTS_IMAGE}" = "${CHECKPOINTS_IMAGE%@sha256:*}" ]; then
            echo "SAMPLEWORKS_CHECKPOINTS_IMAGE must be digest-pinned (@sha256:...), got: ${CHECKPOINTS_IMAGE}"
            exit 1
          fi
          case "${CHECKPOINTS_IMAGE%%/*}" in
            *.*|*:*|localhost)
              echo "SAMPLEWORKS_CHECKPOINTS_IMAGE is a Harbor path without the registry host, got: ${CHECKPOINTS_IMAGE}"
              exit 1 ;;
          esac
          echo "image=${ASTERA_REGISTRY}/${CHECKPOINTS_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push public image
        id: public-build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Dockerfile
          target: public
          platforms: linux/amd64
          push: true
          tags: ${{ steps.public-meta.outputs.tags }}
          labels: ${{ steps.public-meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.CUDA_BASE_IMAGE }}
            CHECKPOINTS_IMAGE=${{ steps.checkpoint-ref.outputs.image }}
          provenance: false

      - name: Disk and memory after build
        if: always()
        run: |
          df -h /
          free -h

      - name: Public image digest
        run: echo "Public image pushed with digest ${{ steps.public-build.outputs.digest }}"

  astera:
    name: Astera EXT image
    runs-on: ubuntu-latest
    needs: public
    # Holds the Tailscale trust credential and the Harbor robot; deployable
    # from main and v* tags only.
    environment: harbor-publish
    permissions:
      contents: read
      id-token: write
    env:
      ASTERA_REGISTRY: ${{ secrets.ASTERA_REGISTRY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # The image bakes the model checkpoints; the hosted runner's default free
      # space is not enough.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
            /usr/lib/jvm /opt/microsoft /opt/google /opt/az /usr/share/az_* /usr/local/julia* /usr/share/miniconda || true
          sudo apt-get clean || true
          docker system prune -af || true
          df -h /
          free -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Validate Astera registry configured
        run: |
          # The Harbor credentials are sent to whatever host this names, so an
          # empty value (login-action then defaults to Docker Hub) or a public
          # registry would hand them to a third party. Fail fast on both.
          if [ -z "${ASTERA_REGISTRY}" ]; then
            echo "ASTERA_REGISTRY repository secret must be set."
            exit 1
          fi
          case "${ASTERA_REGISTRY}" in
            docker.io|index.docker.io|registry-1.docker.io)
              echo "ASTERA_REGISTRY must be the internal registry, not a public one."
              exit 1 ;;
          esac

      - name: Join Astera tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_CI_CLIENT_ID }}
          audience: ${{ vars.TS_CI_AUDIENCE }}
          tags: tag:ci-n

      - name: Wait for Harbor
        run: |
          for _ in $(seq 1 12); do
            curl -fsS --max-time 5 "https://${ASTERA_REGISTRY}/api/v2.0/ping" && exit 0
            sleep 5
          done
          echo "Astera registry unreachable over the tailnet."
          exit 1

      - name: Login to Harbor
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.ASTERA_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Docker metadata for Astera image
        id: astera-meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.ASTERA_REGISTRY }}/${{ env.ASTERA_IMAGE_NAME }}
          # Tags in the `diffuse` project are immutable: no moving tags
          # (latest, sampleworks). A release tag's commit was already pushed as
          # sha-<short> from main, so tag builds push only the version tags.
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,enable=${{ github.ref_type != 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}

      - name: Validate public image digest
        env:
          PUBLIC_IMAGE_DIGEST: ${{ needs.public.outputs.image-digest }}
        run: |
          if [ -z "${PUBLIC_IMAGE_DIGEST}" ]; then
            echo "public job did not produce an image digest."
            exit 1
          fi
          if [ "${PUBLIC_IMAGE_DIGEST}" = "${PUBLIC_IMAGE_DIGEST#sha256:}" ]; then
            echo "public job produced a non-sha256 digest: ${PUBLIC_IMAGE_DIGEST}"
            exit 1
          fi

      - name: Build and push Astera image
        id: astera-build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Dockerfile.astera
          platforms: linux/amd64
          push: true
          tags: ${{ steps.astera-meta.outputs.tags }}
          labels: ${{ steps.astera-meta.outputs.labels }}
          build-args: |
            PIXI_WITH_CHECKPOINTS_IMAGE=${{ env.ASTERA_REGISTRY }}/${{ env.PUBLIC_IMAGE_NAME }}@${{ needs.public.outputs.image-digest }}
          provenance: false

      - name: Disk and memory after build
        if: always()
        run: |
          df -h /
          free -h

      - name: Astera image digest
        env:
          DIGEST: ${{ steps.astera-build.outputs.digest }}
          TAGS: ${{ steps.astera-meta.outputs.tags }}
        run: |
          echo "Astera image pushed with digest ${DIGEST}"
          tag="$(printf '%s\n' "${TAGS}" | head -1)"
          echo "actl catalog ref: \`${tag#*/}@${DIGEST}\` (registry host omitted)" >> "$GITHUB_STEP_SUMMARY"
