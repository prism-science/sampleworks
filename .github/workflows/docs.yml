name: Docs

on:
  push:
    branches: [main, fy/docs-sphinx]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Sphinx and the package
        run: |
          python -m pip install --upgrade pip
          pip install sphinx myst-parser furo
          pip install .

      - name: Generate API stubs
        run: sphinx-apidoc --force --separate -o docs/api src/sampleworks

      - name: Build the site
        run: sphinx-build -b html docs docs/_build/html

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
