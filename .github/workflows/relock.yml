name: Relock

# Regenerate pixi.lock on Linux and commit it back to the dispatched branch.
# Run it (Actions tab -> Relock -> Run workflow, pick the branch) whenever
# pyproject.toml changes and the lock needs refreshing. It is the only way to
# regenerate the lock: `pixi lock` is all-or-nothing, with no --environment or
# --platform selector, and solving a linux-64 environment needs a linux-64
# prefix, which a Mac cannot create.
#
# Some dependencies have to be BUILT to read their metadata, which is what ties
# the solve to a platform. Those are the sdist-only ones -- ihm has no wheel at
# any version, modelcif's start at 1.6 while boltz and protenix pin below it --
# not the editable `sampleworks` path dependency, whose metadata is static and
# never built (#383).
#
# ONE KNOWN FAILURE, and it is narrow. If the lock and the manifest disagree
# about a git dependency's REV, the affected environments go stale and are
# re-resolved from scratch, and a from-scratch osx-arm64 resolve needs an osx
# prefix this Linux runner cannot create. Reset pixi.lock to a state without
# that rev first and the change becomes additive, which resolves fine. Deleting
# pixi.lock also works and churns unrelated versions.
#
# Everything else relocks normally. Changing which environments carry a
# dependency, at an unchanged rev, is additive: measured at 7 lines and 1 line
# of diff on two runs, both green.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v0.73.0
          run-install: false

      - name: Regenerate lockfile
        # The runner has no GPU, so fake the __cuda virtual package that the
        # cuda=12 system-requirement needs; otherwise solving the CUDA envs
        # (e.g. boltz-analysis on linux-64-cuda-12) fails with 'missing virtual
        # packages: __cuda >= 12'.
        env:
          CONDA_OVERRIDE_CUDA: "12"
        run: pixi lock

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- pixi.lock; then
            echo "pixi.lock already up to date; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pixi.lock
            git commit -m "chore: relock pixi.lock on linux (pixi v0.73.0)"
            git push origin HEAD:${{ github.ref_name }}
          fi
