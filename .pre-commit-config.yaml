repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
        exclude: \.(cif|pdb|ccp4|mtz|mrc)$
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.(cif|pdb|ccp4|mtz|mrc)$

  - repo: local
    hooks:
      - id: sort_pyproject
        name: sort pyproject.toml
        entry: toml-sort
        args: ["-i", "--sort-table-keys", "--sort-inline-tables"]
        language: python
        files: ^pyproject\.toml$
        additional_dependencies:
          - toml-sort==0.24.3

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.9
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Ruff runs from the pixi dev environment rather than a pinned hook repo, so the
  # version pinned in pyproject.toml is the one hooks, editors, and CI all use.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'pixi run -e boltz-dev ruff check --force-exclude --verbose --fix "$@"' --
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: bash -c 'pixi run -e boltz-dev ruff format --force-exclude --verbose "$@"' --
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

  - repo: local
    hooks:
      - id: ty-boltz
        name: ty (boltz environment)
        entry: bash -c 'pixi run -e boltz-dev ty check "$@"' --
        language: system
        types: [python]
        pass_filenames: true
        exclude: (real_space_density|protenix|rf3|rfd3|bioemu2)
        priority: 50

      - id: ty-rf3
        name: ty (rf3 environment)
        entry: bash -c 'pixi run -e rf3-dev ty check "$@"' --
        language: system
        types: [python]
        pass_filenames: true
        files: (rf3|rfd3)
        priority: 50

      - id: ty-bioemu2
        name: ty (bioemu2 environment)
        entry: bash -c 'pixi run -e bioemu2-dev ty check "$@"' --
        language: system
        types: [python]
        pass_filenames: true
        files: bioemu2
        priority: 50

      - id: ty-protenix
        name: ty (protenix environment)
        # protenix pins triton and CUDA wheels, so protenix-dev has no macOS build; CI covers it.
        entry: bash -c 'if [ "$(uname)" = Darwin ]; then echo "ty-protenix skipped on macOS"; exit 0; fi; pixi run -e protenix-dev ty check "$@"' --
        language: system
        types: [python]
        pass_filenames: true
        files: protenix
        priority: 50
