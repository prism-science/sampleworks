# RF3 inference config: the `train_cfg` of
# https://files.ipd.uw.edu/pub/rf3/rf3_foundry_01_24_latest_remapped.ckpt, reduced to the
# sections RF3InferenceEngine reads (trainer, model, and the first validation transform).
# trainer.output_dir, a training scratch path, is blanked. Tests build a randomly
# initialized RF3 from this instead of loading the checkpoint (see tests/random_init.py).
trainer:
  strategy: ddp
  accelerator: gpu
  devices_per_node: 8
  num_nodes: 2
  loss:
    confidence_loss:
      _target_: rf3.loss.af3_confidence_loss.ConfidenceLoss
      weight: 1.0
      plddt:
        weight: 1.0
        n_bins: 50
        max_value: 1.0
      pae:
        weight: 1.0
        n_bins: 64
        max_value: 32
      pde:
        weight: 1.0
        n_bins: 64
        max_value: 32
      exp_resolved:
        weight: 1.0
        n_bins: 2
        max_value: 1
      log_statistics: true
      rank_loss:
        use_listnet_loss: false
        weight: 0.0
  metrics:
    by_type_lddt:
      _target_: rf3.metrics.lddt.ByTypeLDDT
    all_atom_lddt:
      _target_: rf3.metrics.lddt.AllAtomLDDT
    distogram:
      _target_: rf3.metrics.distogram.DistogramLoss
    distogram_comparisons:
      _target_: rf3.metrics.distogram.DistogramComparisons
    distogram_entropy:
      _target_: rf3.metrics.distogram.DistogramEntropy
    chiral_loss:
      _target_: rf3.metrics.chiral.ChiralLoss
    unresolved_rasa:
      _target_: rf3.metrics.rasa.UnresolvedRegionRASA
    ptm:
      _target_: rf3.metrics.predicted_error.ComputePTM
    iptm:
      _target_: rf3.metrics.predicted_error.ComputeIPTM
    count_clashing_chains:
      _target_: rf3.metrics.clashing_chains.CountClashingChains
  _target_: rf3.trainers.rf3.RF3TrainerWithConfidence
  validate_every_n_epochs: 9999
  max_epochs: 10000
  n_examples_per_epoch: 8000
  prevalidate: false
  n_recycles_train: 4
  clip_grad_max_norm: 10.0
  output_dir: null
  checkpoint_every_n_epochs: 1
  precision: bf16-mixed
  grad_accum_steps: 16
model:
  optimizer:
    _target_: torch.optim.Adam
    lr: 0
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
  lr_scheduler:
    _target_: rf3.training.schedulers.AF3Scheduler
    base_lr: 0.0018
    warmup_steps: 1000
    decay_factor: 0.95
    decay_steps: 50000
  ema:
    decay: 0.999
  net:
    _target_: rf3.model.RF3.RF3WithConfidence
    c_s: 384
    c_z: 128
    c_atom: 128
    c_atompair: 16
    c_s_inputs: 449
    feature_initializer:
      input_feature_embedder:
        features:
        - restype
        - profile
        - deletion_mean
        atom_attention_encoder:
          c_token: 384
          c_atom_1d_features: 393
          c_tokenpair: 128
          use_inv_dist_squared: true
          atom_1d_features:
          - ref_pos
          - ref_charge
          - ref_mask
          - ref_element
          - ref_atom_name_chars
          - ref_pos_ground_truth
          - has_atom_level_embedding
          atom_transformer:
            n_queries: 32
            n_keys: 128
            l_max: 40000
            diffusion_transformer:
              n_block: 3
              diffusion_transformer_block:
                n_head: 4
                no_residual_connection_between_attention_and_transition: true
                kq_norm: true
          use_atom_level_embedding: true
          atom_level_embedding_dim: 384
      relative_position_encoding:
        r_max: 32
        s_max: 2
    recycler:
      n_pairformer_blocks: 48
      pairformer_block:
        p_drop: 0.25
        triangle_multiplication:
          d_hidden: 128
        triangle_attention:
          n_head: 4
          d_hidden: 32
        attention_pair_bias:
          n_head: 16
      template_embedder:
        n_block: 2
        raw_template_dim: 66
        c: 64
        p_drop: 0.25
        use_fourier_encoding: false
      msa_module:
        n_block: 4
        c_m: 64
        p_drop_msa: 0.15
        p_drop_pair: 0.25
        msa_subsample_embedder:
          num_sequences: 1024
          dim_raw_msa: 35
          c_s_inputs: 449
          c_msa_embed: 64
        outer_product:
          c_msa_embed: 64
          c_outer_product: 32
          c_out: 128
        msa_pair_weighted_averaging:
          n_heads: 8
          c_weighted_average: 32
          c_msa_embed: 64
          c_z: 128
          separate_gate_for_every_channel: true
        msa_transition:
          n: 4
          c: 64
        triangle_multiplication_outgoing:
          d_pair: 128
          d_hidden: 128
          bias: true
        triangle_multiplication_incoming:
          d_pair: 128
          d_hidden: 128
          bias: true
        triangle_attention_starting:
          d_pair: 128
          n_head: 4
          d_hidden: 32
          p_drop: 0.0
        triangle_attention_ending:
          d_pair: 128
          n_head: 4
          d_hidden: 32
          p_drop: 0.0
        pair_transition:
          n: 4
          c: 128
    diffusion_module:
      sigma_data: 16
      c_token: 768
      f_pred: edm
      diffusion_conditioning:
        c_s_inputs: 449
        c_t_embed: 256
        relative_position_encoding:
          r_max: 32
          s_max: 2
      atom_attention_encoder:
        c_tokenpair: 128
        c_atom_1d_features: 393
        use_inv_dist_squared: true
        atom_1d_features:
        - ref_pos
        - ref_charge
        - ref_mask
        - ref_element
        - ref_atom_name_chars
        - ref_pos_ground_truth
        - has_atom_level_embedding
        atom_transformer:
          n_queries: 32
          n_keys: 128
          l_max: 40000
          diffusion_transformer:
            n_block: 3
            diffusion_transformer_block:
              n_head: 4
              no_residual_connection_between_attention_and_transition: true
              kq_norm: true
        broadcast_trunk_feats_on_1dim_old: false
        use_chiral_features: true
        no_grad_on_chiral_center: false
        use_atom_level_embedding: true
        atom_level_embedding_dim: 384
      diffusion_transformer:
        n_block: 24
        diffusion_transformer_block:
          n_head: 16
          no_residual_connection_between_attention_and_transition: true
          kq_norm: true
      atom_attention_decoder:
        atom_transformer:
          n_queries: 32
          n_keys: 128
          l_max: 40000
          diffusion_transformer:
            n_block: 3
            diffusion_transformer_block:
              n_head: 4
              no_residual_connection_between_attention_and_transition: true
              kq_norm: true
    distogram_head:
      bins: 65
    inference_sampler:
      solver: af3
      num_timesteps: 200
      min_t: 0
      max_t: 1
      sigma_data: 16
      s_min: 0.0004
      s_max: 160
      p: 7
      gamma_0: 0.8
      gamma_min: 1.0
      noise_scale: 1.003
      step_scale: 1.5
    mini_rollout_sampler:
      solver: af3
      num_timesteps: 20
      min_t: 0
      max_t: 1
      sigma_data: 16
      s_min: 0.0004
      s_max: 160
      p: 7
      gamma_0: 0.8
      gamma_min: 1.0
      noise_scale: 1.003
      step_scale: 1.5
    confidence_head:
      c_s: 384
      c_z: 128
      n_pairformer_layers: 4
      pairformer:
        p_drop: 0.25
        triangle_multiplication:
          d_hidden: 128
        triangle_attention:
          n_head: 4
          d_hidden: 32
        attention_pair_bias:
          n_head: 16
      n_bins_pae: 64
      n_bins_pde: 64
      n_bins_plddt: 50
      n_bins_exp_resolved: 2
      use_Cb_distances: false
      use_af3_style_binning_and_final_layer_norms: true
      symmetrize_Cb_logits: true
datasets:
  val:
    af3_validation:
      dataset:
        transform:
          _target_: rf3.data.pipelines.build_af3_transform_pipeline
          is_inference: true
          protein_msa_dirs:
          - dir: /projects/msa/rf2aa_af3/rf2aa_paper_model_protein_msas
            extension: .a3m.gz
            directory_depth: 2
          - dir: /projects/msa/rf2aa_af3/missing_msas_through_2024_08_12
            extension: .msa0.a3m.gz
            directory_depth: 2
          - dir: /projects/msa/mmseqs_gpu
            extension: .a3m.gz
            directory_depth: 2
          rna_msa_dirs:
          - dir: /projects/msa/rf2aa_af3/rf2aa_paper_model_rna_msas
            extension: .afa
            directory_depth: 0
          add_residue_is_paired_feature: true
          n_recycles: 10
          crop_size: null
          n_msa: 1024
          diffusion_batch_size: 4
          max_atoms_in_crop: null
          return_atom_array: true
          run_confidence_head: true
          p_unconditional: 1.0
          p_dropout_atom_level_embeddings: 0.0
          p_dropout_ref_conf: 0.0
          take_first_chiral_subordering: false
          use_element_for_atom_names_of_atomized_tokens: false
