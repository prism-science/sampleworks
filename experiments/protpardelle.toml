description = "Protpardelle canonical occ-sweep job. Make sure to set PROTPARDELLE_MODEL_PARAMS"

[defaults]
DATA_DIR = "/data/inputs"
RESULTS_DIR = "/data/results/protpardelle"
MSA_CACHE_DIR = "/root/.sampleworks"
PROTEINS_CSV = "${DATA_DIR}/proteins.csv"
PPDL_CC89_CHECKPOINT = "/mnt/diffuse-shared/marcus/model_params/weights/cc89_epoch415.pth"

[shared_args]
proteins = "${PROTEINS_CSV}"
model = "protpardelle"
scalers = "pure_guidance"
guidance-start = 0.8
num-diffusion-steps = 500
partial-diffusion-start = 0.6
ensemble-sizes = "8"
gradient-weights = "0.0 0.02 0.035 0.05 0.1 0.2"
model-checkpoint = "${PPDL_CC89_CHECKPOINT}"
gradient-normalization = true
augmentation = false
align-to-input = true

[[jobs]]
name = "protpardelle"
env = "protpardelle"
gpu_count = 2
output_subdir = "protpardelle"
args = {}
